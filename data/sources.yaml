# 실제 종가를 받아 올 대상. tools/update_prices.py가 읽는다.
# 이름이 곧 data/prices/이름.csv의 파일 이름이다.
#   기업: companies.yaml의 id와 같은 이름을 쓴다.
#   벤치마크: site.yaml의 benchmarks에 적은 파일 이름을 쓴다.
#
# source: krx   → 국내 종목. code에 종목코드 6자리 (수정주가)
# source: yahoo → 지수와 해외 종목. symbol에 야후 기호
# start: 이 날짜부터 받는다. 커버리지 개시일보다 앞이어야 한다. 비우면 3년 전 1월 1일.
#
# 국내 종목도 지금은 yahoo로 받는다: 리포트의 주가 자료가 야후 파이낸스이고,
# GitHub 서버에서 pykrx가 되는지 아직 확인하지 못했다. 확인되면 krx(수정주가)로 바꿔도 된다.

