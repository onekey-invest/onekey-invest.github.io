    | 적정가치 | 23,700원 | 주 방식(P/B)과 과거 시험에서 가장 덜 빗나간 방식의 평균(둘이 같다) |
    | 목표주가 | 22,200원 | 기준일 주가 20,800원과 적정가치 차이의 절반만 좁힘 |

    이익이 운임을 따라 크게 흔들려 자산 배수를 주 방식으로 뒀다. 네 가지 방식을 과거 다섯 시점에 돌리면 P/B가 1년 뒤 주가와 6.1% 차이로 가장 덜 빗나갔다. EV/EBITDA에 순현금을 더한 값은 20,573원, P/E로 본 값은 18,461원.
