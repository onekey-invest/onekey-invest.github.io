  tags: [해운, 컨테이너, 순현금]
  points:
    - 운임 지수(SCFI) 3분기 평균은 3,388로 2분기(2,337)보다 45% 높다. 과거 9개 분기에 가장 덜 빗나간 식으로 3분기 영업이익 9,580억원 추정(컨센서스 6,865억원). 다만 최근 세 분기는 컨센서스(평균 오차 420억원)가 이 모델(884억원)보다 정확했다
    - 2분기에는 매출이 6,832억원 늘 때 영업비용이 5,982억원 늘었다. 3분기에도 늘어난 매출의 같은 몫이 비용으로 나가면 영업이익은 4,208억원이다. 컨센서스는 그 사이에 있다
    - 주가는 주당순자산의 0.68배(과거 중앙값 0.73배), 순현금 65,429억원이 시가총액의 37%다. 2027년은 SCFI가 1,977로 돌아간다고 보고 영업이익 15,181억원 추정
  recheck: 3분기 실적에서 컨테이너 영업이익률이 2분기보다 오르지 않거나, 호르무즈 해협이 열려 운임 지수가 빠르게 내리거나, 선박 투자로 순현금이 계획보다 빨리 줄 경우
