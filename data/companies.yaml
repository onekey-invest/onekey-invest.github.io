    - 주가는 2027년 추정 주당순이익의 4.5배다(과거 P/E 중앙값 14.7배). 주가에는 2027년 이익이 추정의 31%로 준다는 값이 들어 있다
  recheck: 메모리 수출물가지수가 두 달 이어 내리거나, Micron이 가이던스를 직전 분기 실적 아래로 내거나, 3분기 확정 실적에서 DS 영업이익이 추정에 크게 못 미칠 경우
  valuation: |
