  points:
    - 3분기 카지노 매출은 월 공시로 이미 나와 있다. 새로 연 하얏트 리젠시의 호텔 매출을 더해 3분기 수익을 3,542억원으로 추정(컨센서스 3,317억원)
    - 증권사는 최근 세 분기 연속 영업이익을 높게 봤다. 틀린 곳은 매출이 아니라 비용이다. 급여와 기타비용이 해마다 6.7%씩 늘었고 새 호텔 운영비용이 더해졌다
    - 3분기 영업이익 487억원(컨센서스 508억원), 2027년 1,304억원(2,037억원) 추정. 주가는 주당순자산의 0.49배지만, 차입과 비지배지분을 빼고 보는 EV/EBITDA로는 주당 8,589원으로 지금 주가보다 낮다
  recheck: 3분기 실적에서 급여·기타비용이 수익만큼 늘지 않거나, 드롭액 증가가 빨라지거나, 하얏트 리젠시가 흑자로 돌아설 경우
