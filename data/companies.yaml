  points:
    - 3분기 시장 거래대금(KRX + NXT)은 하루 52.4조원으로 2분기(90.0조원)보다 42% 줄었다. 위탁매매를 약정금액 × 수수료율로 쪼개 낸 3분기 영업이익은 5,671억원(컨센서스 5,175억원)
