    - 2027년 운임 지수는 지난 사이클(2024년 홍해)의 정점 뒤 경로로 2,055, 영업이익 10,769억원(컨센서스 11,798억원). 2028년은 1,695, 1,011억원. 주가는 주당순자산의 0.68배(과거 중앙값 0.73배)
