- id: paradise
  name: 파라다이스
  ticker: "034230"
  market: KOSPI
  benchmark: KOSPI
  industries: [casino]
  tags: [외국인 카지노, 복합리조트]
  points:
    - 3분기 카지노 매출은 월 공시로 이미 나와 있다. 새로 연 하얏트 리젠시의 호텔 매출을 더해 3분기 수익을 3,542억원으로 추정(컨센서스 3,317억원)
    - 증권사는 최근 세 분기 연속 영업이익을 높게 봤다. 틀린 곳은 매출이 아니라 비용이다. 급여와 기타비용이 해마다 6.7%씩 늘었고 새 호텔 운영비용이 더해졌다
    - 3분기 영업이익 487억원(컨센서스 508억원), 2027년 1,304억원(2,037억원) 추정. 주가는 주당순자산의 0.49배지만, 차입과 비지배지분을 빼고 보는 EV/EBITDA로는 주당 8,589원으로 지금 주가보다 낮다
  recheck: 3분기 실적에서 급여·기타비용이 수익만큼 늘지 않거나, 드롭액 증가가 빨라지거나, 하얏트 리젠시가 흑자로 돌아설 경우
  valuation: |
    | 항목 | 값 | 근거 |
    |---|---|---|
    | 순자산으로 본 가치 | 16,501원 | 과거 P/B 중앙값 0.82배 × 2026년 말 주당순자산 20,243원 |
    | EV/EBITDA로 본 가치 | 8,589원 | 과거 EV/EBITDA 중앙값 8.2배 × 2027년 EBITDA 2,149억원 − 2026년 말 순차입금·비지배지분 9,987억원 |
    | 적정가치 | 12,545원 | 두 값의 평균 |
    | 목표주가 | 11,200원 | 기준일 주가 9,800원과 적정가치 차이의 절반만 좁힘 |

    감가상각이 영업이익의 61.1%이고 차입이 느는 회사라 P/B와 EV/EBITDA를 평균했다(과거 다섯 시점에 돌려 보면 어느 방식도 40% 안팎 빗나가 시험으로는 가르지 못했다). P/E로 본 가치는 7,710원. 장충동 호텔 투자가 끝나는 2028년 말 순차입금(9,697억원)을 넣으면 EV/EBITDA로 본 가치는 5,356원이다.
  risks: |
    - 급여·기타비용 증가율 가정 하나에 2027년 추정이 크게 기댄다(1%p 오르면 영업이익 67억원 감소)
    - 홀드율이 평균보다 높게 이어지면 추정이 낮았던 것이 된다(카지노 순매출 ÷ 드롭액 0.1%p에 60억원)
    - 하얏트 객실이 카지노 드롭액으로 이어지면 증권사 쪽 추정이 맞는다(드롭액 증가율 1%p에 68억원)
