    - 3분기 영업이익 3,718억원 추정(컨센서스 3,475억원). 조업일수가 60일에서 56일로 줄어 매출(30,974억원)은 컨센서스(31,882억원)보다 적게 봤고, 이익률은 배 값이 오른 만큼의 절반을 얹었다. 같은 방식의 9개 분기 평균 오차는 456억원, 컨센서스 기록이 있는 세 분기에는 291억원(컨센서스 424억원)
    - 장부 매출은 2026년 11.3조원에서 2027년 15.1조원이 된다. 2027년 영업이익 21,397억원(컨센서스 19,585억원), 2028년 23,678억원. 2028년 매출은 2027년에 받을 수주에 달려 있다
