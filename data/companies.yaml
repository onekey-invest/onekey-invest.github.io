    | 자기자본이익률로 고친 P/B | 813,268원 | 위 값 × (2027년 자기자본이익률 42.6% ÷ 과거 중앙값 8.5%) |
    | 적정가치 | 813,268원 | 자산 배수 둘 가운데 과거 시험에서 덜 빗나간 것(둘째)과 전체에서 가장 덜 빗나간 것(같다)의 평균 |
    | 목표주가 | 537,600원 | 기준일 주가 262,000원과 적정가치 차이의 절반만 좁힘 |

    네 가지 방식을 과거 다섯 시점에 돌리면 모두 1년 뒤 주가를 50% 안팎 낮게 봤다(주가가 그 사이 몇 배가 됐다). 고친 P/B는 이익이 정점일 때 가장 높은 값을 준다. 메모리 값이 지난 정점 뒤처럼 내릴 때의 주당순이익에 과거 P/E 중앙값을 주면 639,148원.
