    - 2027년 거래대금은 3분기 실제에 지난 사이클의 모양을 이어 하루 35.6조원, 영업이익 19,035억원, 자기자본이익률 11.8%(회사 목표 12%). 2026년 결산 추정 배당수익률 8.5%
