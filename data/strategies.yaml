    | 샤프 | 1.26 | 0.72 |

    ### 검증 절차에서의 결과

    규칙을 정할 때는 2021년 8월까지의 자료만 썼고, 그 뒤 구간은 기준을 미리 적어 두고 한 번씩만 열었다.

    - 검증 구간(2021.09 ~ 2024.08): 통과. 변동성을 맞춘 한국 주식 대비 연 +8.1%p.
    - 최종 구간(2024.09 ~ 2026.08): **탈락.** 성과 기준 둘은 채웠으나(변동성을 맞춘 한국 주식 대비 연 +6.7%p) 변동성이 21.7%로 미리 적은 한도 16%를 넘었다. 같은 기간 한국 주식의 변동성은 44.9%였다. 그 한도는 과거 변동성에 여유를 곱해 잡은 것이었고 따로 근거를 대지 못한 숫자였다. 판정은 고치지 않았다.

    위 5년의 숫자는 규칙을 묶기 전에 이미 본 구간의 것이다. 금리 조건은 이 구간의 결과를 본 뒤에 넣었다. **처음 보는 기록은 규칙을 공개한 뒤의 첫 거래일(2026.10.12)부터다.** 운용 개시일은 화면에 운용 기록이 그려지도록 10.01로 소급해 잡았다.
  log: |
    - 2026-10-11 규칙 공개.
