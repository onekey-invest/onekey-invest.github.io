    미국 시장 전체와 같은 크기·업종 구성을 지키면서, 그 안에서 공시를 덜 고친 회사를 더 드는 것. 시장만큼 벌되 조금 덜 흔들리는 것이 목표다.

    ### 근거

    - 회사가 분기 보고서를 크게 고치면 그 뒤 이익과 주가가 나빠지는 경향이 있다(Cohen·Malloy·Nguyen, "Lazy Prices"). 미국 분기 보고서 68만 건으로 직접 세어 같은 방향을 확인했다.
    ### 환헤지

    달러는 미국 주식이 빠질 때 오르는 완충이다. 시장이 불안할 때는 이 완충을 그대로 두고, 편안할 때는 환율의 흔들림만 남으므로 그만큼을 막는다. 신호 일곱 가운데 켜진 수에 따라 0 ~ 50%를 헤지한다.

    - 2002 ~ 2026년 미국 시장 전체의 원화 수익률에 이 규칙을 얹으면, 해마다 수익률의 흩어짐이 17.7%에서 16.9%로 줄고 그 해 안의 변동성이 환헤지 없을 때보다 낮았던 해가 24해 가운데 18해였다. 2008년에는 헤지가 대부분 풀려 있었다.
    - 이 전략에서는(2011.01 ~ 2026.07, 원화) 변동성이 13.1%에서 12.5%로, 해마다 수익률의 흩어짐이 16.1%에서 14.7%로 줄었다. 헤지 비율은 평균 30%(7 ~ 50%)였다.
    - 헤지 손익은 원/달러 선물의 실제 웃돈(한국거래소 가까운 월물)으로 계산했다.
