    ### 무엇을 확인하려는가

    과거 자료에서 찾은 조건이, 조건을 찾는 데 쓰지 않은 앞으로의 기간에도 통하는지.

    ### 근거

    - 영업현금흐름이 흑자이면서 연구개발 중심으로 크게 투자하는 회사는 2016년 12월 뒤(같은 업종 안에서 12개월 평균 +6.8%p)와 2011 ~ 2016년(+5.2%p) 두 구간 모두에서 평균 수익률이 높았다. 설비 중심으로 투자하는 회사는 두 구간 모두 그렇지 않았다.
    - 조건을 다 채운 종목은 12개월 안에 반토막 난 비율이 3.6%, 하나도 못 채운 종목은 30.0%였다. 세 구간에서 순서가 같았다.
    - 증자하는 회사, 못 벌면서 크게 투자하는 회사, 감사인이 바뀐 회사, 상장한 지 3년이 안 된 회사는 반토막 비율이 두 배 넘게 높았다.
    - 크게 오른 회사 30곳의 사업보고서를 읽어 보니, 주가를 올린 변화가 오르기 전 보고서에 숫자로 보이던 곳은 3곳뿐이었다. 크게 오를 종목을 미리 고르는 규칙은 만들지 못했다.

    ### 서지 않은 것

    - EPS 증가율이 빨라지는 것, 기관이 사 들어간 것, 내부자 매수, 낮은 PSR은 평균 수익률을 올리지 못해 넣지 않았다.
    - 조건마다 무게를 달리 주는 것은 같은 무게보다 일관되게 낫지 않았다.

    ### 한계

    - **운용 개시일(2026년 8월 1일)이 규칙 공개일(10월 12일)보다 앞이다.** 그 사이 두 달 남짓의 기록은 규칙을 정한 뒤에 거슬러 적은 것이다. 규칙을 정하는 데 쓴 자료는 2026년 7월까지이고 8월 뒤의 주가는 쓰지 않았지만, 미리 공개한 뒤에 쌓인 기록은 10월 12일부터다.
    - **조건을 찾은 자료와 아래 백테스트의 자료가 같다.** 처음 보는 기간에서 확인된 적이 없다. 설정 여섯 가지를 돌려 본 뒤 고른 것이기도 하다. 앞으로의 결과는 백테스트보다 낮게 나오는 것을 기본으로 본다.
    - 2017 ~ 2026년 한 시기의 값이다. 대형 성장주와 오르던 종목이 계속 오르는 흐름이 강했던 때이고, 점수와 동점 처리에 "직전 12개월 수익률"이 들어 있어 그 덕을 봤을 것이다.
    - 지수보다 더 흔들린다(베타 1.10, 변동성 20.5% 대 15.7%).
    - 교체가 잦다(연 265%쯤).
    - 운용 기록은 원화다(환헤지 없음). 달러로 번 것과 원/달러가 움직인 것이 섞여 보인다. 아래 백테스트는 달러 기준이다.
    - 과거 시험은 고르는 날 종가에 샀다고 봤고 3 · 6 · 9 · 12월 말에 골랐다. 운용은 다음 거래일 종가에 사고 1 · 4 · 7 · 10월 말에 고른다.
