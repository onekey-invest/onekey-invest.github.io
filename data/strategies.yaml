# 가상운용 전략. 아래 두 전략은 화면 확인용 예시다.
#
# category: domestic(국내 주식) / overseas(해외 주식) / multi(멀티에셋)
# status: 운용 중 / 중단
# published: 규칙을 공개한 날. started: 운용 개시일. stopped: 중단일(운용 중이면 비운다)
# 거래 기록은 data/trades/전략id.csv, 백테스트는 data/backtests/전략id.csv(없어도 된다)
# rationale, backtest, log는 마크다운으로 쓴다. 기업 페이지가 있는 종목은 거래 기록에 종목 id를 쓴다.

- id: dom-a
  name: 국내주식 전략 A
  subtitle: 커버리지 집중
  category: domestic
  status: 운용 중
  benchmark: KOSPI
  published: 2026-04-01
  started: 2026-04-06
  stopped:
  initial: 10000000
  commission: 0.00015     # 매수·매도 금액 대비 수수료율
  sell_tax: 0.002         # 매도 금액 대비 세율
  rules:
    - 매수 의견을 낸 커버 종목 중 상승여력이 15% 이상인 종목만 편입
    - 종목당 비중은 편입 시점 기준 35% 이하
    - 의견을 중립 이하로 낮추면 다음 거래일에 전량 매도
    - 분기마다 한 번 비중을 점검
  fill: 신호가 나온 다음 거래일의 종가로 체결했다고 가정
  code_url: ""            # 백테스트 코드 주소(GitHub). 없으면 비워 둔다
  rationale: |
    ### 가설

    직접 분석해 매수 의견을 낸 종목은 벤치마크보다 나은 성과를 낸다.

    ### 경제적 논리

    리포트의 판단이 맞다면 그 판단에 실제로 비중을 실었을 때도 초과수익이 나와야 한다. 성적표가 종목별 판단을 검증한다면, 이 전략은 판단에 따라 자금을 배분했을 때의 결과를 검증한다.

    ### 참고자료

    (선행 연구와 참고한 자료를 적는 자리)

    ### 한계

    커버 종목이 적어 분산 효과가 작다. 종목 하나의 실패가 전체 성과를 좌우한다.
  backtest: |
    ### 설정

    | 항목 | 설정 |
    |---|---|
    | 기간 | 2025.10.01 ~ 2026.04.03 |
    | 대상 | 당시 커버 종목 |
    | 자료 출처 | 예시 시세 |
    | 상장폐지 종목 | 해당 없음 |
    | 거래비용 | 수수료 0.015%, 매도 세금 0.20% |
    | 체결 | 다음 거래일 종가 |
    | 리밸런싱 | 분기 |
    | 벤치마크 | KOSPI |

    ### 결과

    | 항목 | 값 |
    |---|---|
    | 누적수익률 | (입력) |
    | CAGR / 변동성 | (입력) |
    | MDD / 샤프 | (입력) |
    | 회전율 | (입력) |

    ### 강건성 검증

    - 기간 분리: (전략을 만든 기간과 검증한 기간을 나눈 결과)
    - 파라미터 민감도: (기준값을 바꿨을 때의 결과)
    - 비용 스트레스: (거래비용을 2배로 잡았을 때의 결과)

    커버 종목이 생긴 뒤의 6개월만 대상으로 한 짧은 백테스트여서 전략의 유효성을 말해 주지 못한다.
  log: |
    - 2026.04.01 규칙 공개
    - 2026.04.06 운용 개시. 예시전자, 예시정밀 편입
    - 2026.07.01 분기 점검. 예시정밀 일부 매도

- id: dom-b
  name: 국내주식 전략 B
  subtitle: 소재 반등
  category: domestic
  status: 중단
  benchmark: KOSDAQ
  published: 2025-12-15
  started: 2025-12-16
  stopped: 2026-06-11
  initial: 10000000
  commission: 0.00015
  sell_tax: 0.002
  rules:
    - 판가 반등이 예상되는 소재 업체에 집중 투자
    - 의견을 중립 이하로 낮추면 다음 거래일에 전량 매도
  fill: 신호가 나온 다음 거래일의 종가로 체결했다고 가정
  rationale: |
    **가설.** 판가가 바닥을 지난 소재 업체는 실적보다 주가가 먼저 반등한다.

    **논리.** 과거 사이클에서 주가는 판가 저점 1~2개 분기 전에 돌아섰다.
  backtest: |
    백테스트 없이 시작한 전략이다. 이후 전략은 백테스트를 먼저 공개한다.
  log: |
    - 2025.12.15 규칙 공개
    - 2025.12.16 운용 개시. 예시머티리얼즈 편입
    - 2026.06.10 판가 반등 가정이 틀린 것으로 판단. 투자의견 중립으로 하향
    - 2026.06.11 규칙에 따라 전량 매도, 전략 중단

    **회고.** 한 종목에 60% 넘게 실은 것이 손실을 키웠다. 종목당 비중 상한이 규칙에 없었다. 이후 전략에는 비중 상한을 넣었다.
