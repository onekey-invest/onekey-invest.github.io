    | 체결 | 달 끝 판정, 달 끝 종가 |
    | 견줄 것 | 미국 시장 전체(미국 상장 주식 전부, 시가총액 비중, 배당 포함) |

    ### 결과 (2011.01 ~ 2026.07)

    | | 연 수익률 | 변동성 | 샤프 | 가장 큰 낙폭 |
    |---|---|---|---|---|
