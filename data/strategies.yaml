    위 숫자는 달러 기준이다. 환헤지 없이 원화로 바꾸면 같은 기간 연 16.0% · 변동성 13.0% · 샤프 1.04 · 가장 큰 낙폭 −19.3%였다(원/달러 1,131원 → 1,437원). 미국 주식이 빠질 때 원화가 약해져 손실이 줄어드는 완충이 있었다.
