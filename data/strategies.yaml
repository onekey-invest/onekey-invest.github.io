  rationale: |
    ### 무엇을 노리나

    한국 주식 · 미국 주식 · 금을 같은 비중으로 들어, 한국 주식만 든 것과 비슷하게 벌면서 흔들림은 절반쯤으로 줄이는 것.

    ### 근거

    - 2001 ~ 2021년 자료에서 미국 주식과 금이 한국 주식보다 더 번 때는 10년마다 달랐다(미국 주식은 2001 ~ 2011에 연 −5.9%, 2011 ~ 2021에 연 +11.7%. 금은 +15.0%, +1.9%). 섞어 든 것만 네 구간 모두에서 한국 주식 대비 연 +3% 안팎이었다. 어느 자산이 이길지 맞히려는 것이 아니라 한쪽에 지지 않으려는 것이다.
    - 미국 주식과 금은 환헤지를 하지 않은 ETF로 든다. 한국 주식이 나쁜 달에 원화가 약해졌기 때문이다(가장 나빴던 달 10%에 원/달러 +2.4%, 나머지 달 −0.2%).
    - 금리 조건: 2000 ~ 2021년에 한국은행 기준금리가 6개월 전보다 높던 때 한국 주식의 그 뒤 3개월 초과수익은 −1.6%, 그렇지 않은 때는 +3.4%였다.
    - 되돌리는 폭 5%p: 매달 맞추는 것부터 10%p까지 바꿔도 성과가 같았고 매매만 줄었다.

    ### 서지 않은 것

    국면이나 추세로 주식 비중을 움직이는 것, 금 비중을 상황에 따라 움직이는 것, 업종·스타일 ETF를 골라 담는 것은 같은 자료에서 고정 비중보다 낫지 않아 넣지 않았다. 금 비중을 얼마로 둘지는 자료로 가리지 못했다(표본에 따라 답이 반대였다). 그래서 성장 자산을 같은 비중으로 두었다.

    ### 한계

    - **이 전략은 미리 정한 검증 절차를 통과하지 못했다.** 아래 "백테스트"에 적었다.
    - 금리 조건은 금리가 그대로이거나 내리는데 한국 주식이 크게 흔들리는 때를 막지 못한다.
    - 시세는 분배금이 빠진 종가다. 실제보다 조금 낮게 나온다.
    - 한국 주식 몫을 비울 때는 현금으로 둔다(이자 0으로 계산).
