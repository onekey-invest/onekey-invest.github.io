    ### 무엇을 노리나

    넷 가운데 가장 덜 흔들리는 판. 파는 쪽과 추세 층을 함께 써서 낙폭을 줄인다.
    ### 환헤지

    달러는 미국 주식이 빠질 때 오르는 완충이다. 시장이 불안할 때는 이 완충을 그대로 두고, 편안할 때는 환율의 흔들림만 남으므로 그만큼을 막는다. 신호 일곱 가운데 켜진 수에 따라 0 ~ 50%를 헤지한다.

    - 2002 ~ 2026년 미국 시장 전체의 원화 수익률에 이 규칙을 얹으면, 해마다 수익률의 흩어짐이 17.7%에서 16.9%로 줄고 그 해 안의 변동성이 환헤지 없을 때보다 낮았던 해가 24해 가운데 18해였다. 2008년에는 헤지가 대부분 풀려 있었다.
    - 이 전략에서는(2011.01 ~ 2026.07, 원화) 변동성이 11.5%에서 10.7%로, 해마다 수익률의 흩어짐이 14.5%에서 13.1%로 줄었다. 헤지 비율은 평균 30%(7 ~ 50%)였다.
    - 헤지 손익은 원/달러 선물의 실제 웃돈(한국거래소 가까운 월물)으로 계산했다.
