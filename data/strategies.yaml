  code_url: ""
  backtest_bench: 미국 시장 전체
  chart_backtest: false
  rationale: |
    ### 무엇을 노리나

    미국 시장 전체와 같은 크기·업종 구성을 지키면서, 그 안에서 공시를 덜 고친 회사를 더 드는 것. 시장만큼 벌되 조금 덜 흔들리는 것이 목표다.

    ### 근거

    - 회사가 분기 보고서를 크게 고치면 그 뒤 이익과 주가가 나빠지는 경향이 있다(Cohen·Malloy·Nguyen, "Lazy Prices"). 미국 분기 보고서 68만 건으로 직접 세어 같은 방향을 확인했다.
    - 고른 종목을 비슷한 크기끼리 같은 비중으로 견주면, 전략을 세운 2011.01 ~ 2021.08에 연 +1.3%p(t 2.1), 장부를 미리 굳혀 놓고 읽은 2021.09 ~ 2025.07에 연 +3.4%p(t 2.9) 앞섰다.
    - 크기 다섯 묶음 × 고친 정도 다섯 묶음으로 나눠 보면 다섯 묶음 모두에서 덜 고친 쪽이 나았다. 다만 가장 작은 묶음에서 연 +11%, 가장 큰 묶음에서 연 +1.7%로 크기 차이가 크다.

    ### 서지 않은 것

    같은 틀에서 값(싼 주식) · 모멘텀 · 저변동 · 연간 보고서의 고친 정도 · 업종 모멘텀 · 이익 개선 · 신고가를 얹어 봤으나 보탬이 없어 넣지 않았다. 고르는 종목을 위 1/10로 좁히는 것, 작은 회사만 따로 하는 것도 낫지 않았다.

    ### 한계

    - **처음 판(업종만 맞추고 덜 고친 위 1/3만 사던 판)은 미리 정한 검증에서 졌다.** 2021.09 ~ 2025.07에 시가총액 기준보다 연 −2.8%p. 종목은 맞게 골랐으나 아주 큰 종목을 덜 든 것이 까닭이었다. 지금 판은 그 결과를 본 뒤에 크기까지 시장과 맞춘 것이다.
    - 시장 대비 초과는 작다(연 +0.2%p, t 0.2). 통계로 확인된 초과가 아니다.
    - 아래 백테스트 기간은 전략을 만들며 모두 본 구간이다. 규칙을 굳힌 뒤의 기록은 운용 개시일부터 쌓인다.
    - 업종 분류는 지금의 분류를 과거에 그대로 붙였다. 체결은 달 끝 종가로 가정했다.
    - 마지막 12개월(2025.08 ~ 2026.07)에는 덜 고친 쪽이 오히려 뒤졌다.
  backtest: |
    ### 설정

    | 항목 | 설정 |
    |---|---|
    | 기간 | 2011.01 ~ 2026.07 (달마다) |
    | 대상 | 미국 상장 보통주(시가총액 3억 달러 · 하루 거래대금 300만 달러 이상) |
