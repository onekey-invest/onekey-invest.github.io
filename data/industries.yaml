    | 가공식품 | 라면·과자·빙과·유제품·간편식·조미료 | 농심, 오뚜기, 삼양식품, 오리온, 롯데웰푸드, 빙그레, CJ제일제당, 대상, 풀무원, 매일유업, 동서(동서식품) |
