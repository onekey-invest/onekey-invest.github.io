    | 유통 | 대형마트·편의점·슈퍼·온라인을 거쳐 소비자에게 간다 | |
    | 정부 | 물가 관리, 공정거래위원회의 담합 제재(2026년 설탕·밀가루) | |
    
    **경쟁 구도.** 품목마다 시장이 따로 있고 한두 회사가 절반 넘게 차지한다. 자리가 오래 굳어 있어 국내에서 점유율을 뺏어 오는 성장은 작다. 값은 점유율보다 원재료 값과 정부의 물가 관리가 정한다. 그래서 회사 사이의 차이는 해외 매출에서 난다.
    
    **점유율을 읽는 법.** 위 표의 "회사 공시"는 회사가 조사 회사 자료로 사업보고서에 적은 값이고 조사 기관과 기준이 서로 다르다. "매출 비중"은 공시가 없는 품목에서 각 사 품목별 매출로 계산한 주요 업체끼리의 비중이라 수입품과 작은 업체가 빠져 있다. 소매점 판매 자료로 낸 품목별·제조사별 점유율은 [aT 식품산업통계정보의 소매 POS](https://www.atfis.or.kr/home/offsales.do)에서 볼 수 있다(자료 제공사의 허가 없이 인용할 수 없어 여기에는 싣지 않았다).
    
    자세한 분석은 산업 리포트 [내수는 멈췄고 값은 올리기 어렵다. 차이는 해외에서 난다](/reports/food-20261006/)에 있다.
