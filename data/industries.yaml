- id: food
  name: 음식료
  view: 중립
  cycle: 내수 정체, 수출 성장
  updated: 2026-10-06
  points:
    - "식품 제조업 출하액은 2019년 96조원에서 2024년 139조원이 됐다. 2022년까지는 값과 양이 같이 늘었고, 2022~2024년에는 양이 연 0.8%씩 줄었다"
    - "값을 올리기 어렵다. 가공식품 물가 상승률(2.1%)이 전체 물가(2.9%) 아래로 내려왔고, 2026년 설탕·밀가루 담합 과징금이 상장 3개사에서만 4,754억원이다"
    - "품목마다 한두 회사가 차지한다. 라면은 농심 56.3%, 궐련은 KT&G 67.3%, 맥주는 오비맥주와 하이트진로가 주요 3사 매출의 98%"
    - "이익의 차이는 해외에서 난다. 해외 매출이 30% 넘는 7개사의 2025년 영업이익률은 8.1%, 나머지 6개사는 4.1%. 라면 수출은 2026년 1~8월에 26.2% 늘었다"
    - "원재료 값(원화)은 9개월쯤 뒤 가공식품 물가에 나타난다(상관 0.84). 이 지표가 2026년 7월에 1년 전보다 12.9% 높다"
    - "올해 코스피가 66% 오르는 동안 음식료 17개사 평균 주가는 −8.5%. PBR 중앙값 0.73배"
