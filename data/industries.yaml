    **경쟁 구도.** 국내 완성차는 현대차(62.0%)와 기아(38.0%)다. 현대차가 기아의, 기아가 현대모비스의, 현대모비스가 현대차의 최대주주여서 세 회사가 고리로 묶여 있다. 영업이익률은 기아가 현대차보다 높다(2분기 8.0% 대 5.8%).
    
