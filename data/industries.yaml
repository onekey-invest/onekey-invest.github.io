# 커버 산업. 예시 데이터다. 한 기업이 여러 산업에 속할 수 있다(companies.yaml의 industries).

- id: semi-equipment
  name: 반도체 장비
  view: 비중확대
  cycle: 회복 초기
  updated: 2026-09-18
  points:
    - 주요 메모리 업체의 설비투자가 2026년 하반기부터 증가세로 전환
    - 선단 공정 전환에 따라 검사·계측 장비 수요가 전공정 대비 빠르게 증가
    - 국산화율이 낮은 품목에서 점유율 상승 여지
  value_chain: |
    | 단계 | 내용 | 커버 기업 |
    |---|---|---|
    | 전공정 | 증착, 식각, 세정 | 예시전자 |
    | 후공정 | 검사, 계측, 패키징 | 예시정밀 |

    전공정은 고객사 투자 규모에 바로 연동된다. 후공정 검사·계측은 공정이 미세해질수록 투입량이 늘어 투자 규모보다 빠르게 성장한다.

- id: battery-materials
  name: 2차전지 소재
  view: 중립
  cycle: 조정 지속
  updated: 2026-06-10
  points:
    - 전방 수요 둔화로 판가 하락 지속. 재고 조정은 2026년 말까지 이어질 전망
    - 원재료 가격 안정으로 추가 재고 평가손은 제한적
    - 반등 시점은 신규 양산 일정에 달려 있음
  value_chain: |
    | 단계 | 내용 | 커버 기업 |
    |---|---|---|
    | 원재료 | 광물, 전구체 | – |
    | 소재 | 양극재, 음극재, 전해질 | 예시머티리얼즈 |
    | 셀 | 배터리 셀 제조 | – |

    소재 업체의 판가는 원재료 가격과 셀 업체의 재고에 따라 움직인다.
