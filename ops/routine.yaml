# 마켓노트 예약 실행 설정. 예약 실행이 시작할 때 이 파일을 읽는다.
# mode: live  → 실행한 날(한국 시간)의 글을 써서 main에 올린다. 올리면 바로 공개된다.
# mode: test  → test_date의 글을 다시 써서 test_branch에만 올린다. 공개되지 않는다.
mode: live
cutoff: "08:30"          # 이 시각(한국 시간)까지 도착한 뉴스레터만 쓴다
test_date: 2026-10-02
test_branch: routine-test-3

# 글을 쓰기 전에 반드시 이 파일을 읽고, 지시문의 글쓰기 규칙에 더해 따른다. 겹치면 이 파일이 우선한다.
extra_rules: ops/extra_rules.md
