# 평일 저녁에 종가를 받아 사이트를 다시 만들고 GitHub Pages에 올린다.
# 아직 실제 저장소에서 돌려 보지 않았다. 처음 올린 뒤 Actions 탭에서 결과를 확인한다.
# 저장소 설정: Settings → Pages → Source를 "GitHub Actions"로.
name: 매일 갱신과 배포

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 평일 18:30 (한국 시간)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-data.txt

      # 종가를 못 받으면 여기서 멈춘다. 그날은 배포하지 않고 어제 화면이 그대로 남는다.
      - name: 종가 갱신
        if: github.event_name != 'push'
        run: python tools/update_prices.py

      - name: 계산 검증
        run: python -m unittest discover tests

      - name: 사이트 만들기
        run: python build.py

      - name: 바뀐 시세 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices
          git diff --cached --quiet || git commit -m "시세 갱신 $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
