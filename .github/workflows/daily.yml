# 평일 저녁에 종가를 받아 사이트를 다시 만들고 GitHub Pages에 올린다.
# 아직 실제 저장소에서 돌려 보지 않았다. 처음 올린 뒤 Actions 탭에서 결과를 확인한다.
# 저장소 설정: Settings → Pages → Source를 "GitHub Actions"로.
name: 매일 갱신과 배포

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 평일 18:30 (한국 시간)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200    # 사이트 점검이 최근 7일에 올라온 것을 보려면 기록이 있어야 한다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-data.txt

      # 종가를 못 받으면 여기서 멈춘다. 그날은 배포하지 않고 어제 화면이 그대로 남는다.
      - name: 종가 갱신
        if: github.event_name != 'push'
        run: python tools/update_prices.py

      # 한국은행 기준금리를 받는다. 못 받아도 계속 간다(어제까지의 금리로 판정한다).
      - name: 기준금리 갱신
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/update_base_rate.py

      # 가상운용 ETF 전략: 규칙대로 새 거래가 있으면 적는다
      - name: ETF 전략 거래 적기
        if: github.event_name != 'push'
        run: python tools/etf_strategy.py

      # 가상운용 Bottom-Up 1 · US: 든 30종목 전체의 평가값을 적는다. 못 받아도 계속 간다(어제 값이 남는다)
      - name: Bottom-Up 1 US 장부 평가
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/bu_us_book.py

      # 가상운용 국내 개선 롱숏 두 전략: 든 종목 전체의 평가값을 적는다. 못 받아도 계속 간다(어제 값이 남는다)
      - name: 국내 개선 롱숏 장부 평가
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/kr_x_book.py

      # 주요 공시: DART 회사별 RSS(키가 필요 없다. 최근 5영업일치를 기존 목록에 덧붙인다). 못 받아도 계속 간다(어제 목록이 남는다)
      - name: 공시 갱신
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/update_disclosures.py --rss

      - name: 계산 검증
        run: python -m unittest discover tests

      # 그림: 저장소의 그림 원본 엑셀(charts_src/site_charts.xlsx)을 LibreOffice가 열어 새 자료로 그린다. PC가 꺼져 있어도 된다.
      # 모양은 그 엑셀 파일을 따른다(본인이 PC의 엑셀에서 고쳐 저장하면 PC 예약 작업이 파일을 올린다). 못 그리면 전날 그림이 남는다
      - name: 전날 그림 받기
        run: bash tools/get_charts.sh

      - name: 그림 그리기(LibreOffice)
        continue-on-error: true
        id: draw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc python3-uno fonts-nanum > /dev/null
          mkdir -p ~/.config/fontconfig && cp .github/fontconfig/fonts.conf ~/.config/fontconfig/fonts.conf && fc-cache -f > /dev/null
          python build.py --charts /tmp/spec.json > /dev/null
          soffice --headless --invisible --norestore --accept="socket,host=localhost,port=2002;urp;" &
          /usr/bin/python3 tools/lo_charts.py /tmp/spec.json charts_src/site_charts.xlsx static/charts

      - name: 그린 그림 올리기(charts 가지)
        if: steps.draw.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_charts.sh

      - name: 사이트 만들기
        run: python build.py

      # 채점할 분기의 실적 공시가 나왔는데 아직 채점 전이면 저장소에 할 일(이슈)을 연다. 저장소 주인에게 메일이 간다. 같은 것은 한 번만
      - name: 채점 대기 알림
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            title="채점할 것: ${line%%:*}"
            if ! gh issue list --state open --search "$title in:title" --json title -q '.[].title' | grep -qF "$title"; then
              gh issue create --title "$title" --body "$line"
            fi
          done < dist/score_todo.txt

      # 사이트 점검(총괄): 구역마다 멈춘 곳이 있으면 "사이트 점검" 할 일 하나를 열거나 고쳐 쓰고, 다 풀리면 닫는다(OPERATIONS.md 4절)
      - name: 사이트 점검
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/site_health.py > /dev/null
          n=$(cat .health/health_count.txt)
          num=$(gh issue list --state open --search "사이트 점검 in:title" --json number,title -q '.[] | select(.title=="사이트 점검") | .number' | head -1)
          if [ "$n" -gt 0 ]; then
            if [ -n "$num" ]; then gh issue edit "$num" --body-file .health/health.md; else gh issue create --title "사이트 점검" --body-file .health/health.md; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "다 풀렸다 $(TZ=Asia/Seoul date +%F)"
          fi

      # 깨진 링크·권유처럼 읽히는 말·내부 이름이 있으면 여기서 멈춘다(그날은 배포하지 않는다)
      - name: 올리기 전 점검
        run: python tools/check_site.py

      - name: 바뀐 시세 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices data/rates data/trades data/disclosures data/strategy_books/bu-us.json data/strategy_books/kr-x1.json data/strategy_books/kr-x2.json
          git diff --cached --quiet || git commit -m "시세 갱신 $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
